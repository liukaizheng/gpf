[package]
name = "gpf"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# bumpalo = { version = "3", features = ["collections", "allocator_api"] }
bumpalo = {git = "https://github.com/bluurryy/bumpalo.git", branch = "nightly-changes"}
hashbrown = { version = "0", default-features = false, features = [
    "ahash",
    "nightly",
] }
itertools = "0"
rand = { version = "0", features = ["small_rng"] }
tinyvec = { version = "1", features = ["alloc"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tobj = "4"
